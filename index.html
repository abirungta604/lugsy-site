<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lugsy</title>
<style>
  :root { --ink: #3f3270; --muted: #6b5f96; --bg: #fff8ef; --card: #ffffff; --accent: #ff7eb6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 72px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 6px; }
  h2 { font-size: 21px; margin: 36px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; }
  .date { color: var(--muted); margin-bottom: 28px; }
  .short { background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 4px 5px 0 var(--ink); padding: 18px 20px 8px; margin: 0 0 12px; }
  a { color: var(--ink); }
</style>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main>
  <p><img src="/icon.png" alt="Lugsy" width="120" height="120" style="border-radius:27px;border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink)"></p>
  <h1>Lugsy</h1>
  <p class="date">Turn your trips into a video.</p>
  <p>Pick the cities and how you got there, and a small suitcase called Lugsy travels the route across a map. Or let Lugsy find your trips in your photos, on your phone.</p>
  <p><a href="/support/">Support</a> · <a href="/privacy/">Privacy policy</a></p>
  <p class="date">Grillz App Studio Inc.</p>
</main>
</body>
</html>
